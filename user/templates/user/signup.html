<div class="modal fade" id="signupModal" tabindex="-1" role="dialog" aria-labelledby="signupModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="modal-content login-container p-0" style="background: transparent; border: none;">

            <div class="cont">
                <div class="form sign-in">
                    <h2>Welcome</h2>
                    <label>
                        <span>Email</span>
                        <input type="email" />
                    </label>
                    <label>
                        <span>Password</span>
                        <input type="password" />
                    </label>
                    <p class="forgot-pass">Forgot password?</p>
                    <button type="button" class="submit">Sign In</button>

                </div>
                <div class="sub-cont">
                    <div class="img">
                        <div class="img__text m--up">

                            <h3>Don't have an account? Please Sign up!<h3>
                        </div>
                        <div class="img__text m--in">

                            <h3>If you already has an account, just sign in.<h3>
                        </div>
                        <div class="img__btn">
                            <span class="m--up">Sign Up</span>
                            <span class="m--in">Sign In</span>
                        </div>
                    </div>
                    <div class="form sign-up">
                        <form method="post" action="{% url 'user:signup' %}">
                            {% csrf_token %}
                            <h2>Create your Account</h2>
                            <label>
                                <span>Name</span>
                                {{ form.username }}
                            </label>
                            <label>
                                <span>Email</span>
                                {{ form.email }}
                            </label>
                            <label>
                                <span>Password</span>
                                {{ form.password1 }}
                            </label>
                            <label>
                                <span>Password</span>
                                {{ form.password2 }}
                            </label>
                            <button type="button" class="submit">Sign Up</button>
                        </form>
                    </div>
                </div>
            </div>

            <script>
                document.querySelector('.img__btn').addEventListener('click', function () {
                    document.querySelector('.cont').classList.toggle('s--signup');
                });
            </script>
        </div>
    </div>
</div>
